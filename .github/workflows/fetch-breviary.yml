name: Fetch breviary scan
on:
  push:
    branches: [claude/breviary-lauds-translation-jh0n5u]
    paths: [.github/workflows/fetch-breviary.yml, breviary/tools/fetch_onb.py, breviary/tools/job.json, breviary/tools/jobs.py]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-lat imagemagick >/dev/null
      - name: Fetch from ONB IIIF / run jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if [ -f breviary/source/pages.tsv ]; then
            OMP_THREAD_LIMIT=1 PYTHONUNBUFFERED=1 python3 breviary/tools/jobs.py
          else
            OMP_THREAD_LIMIT=1 PYTHONUNBUFFERED=1 python3 breviary/tools/fetch_onb.py
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git pull -q --rebase || true
          git add breviary/source
          git commit -m "Fetch ONB scan and OCR of 1517 Hospitaller breviary" || exit 0
          git push
